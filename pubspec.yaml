name: foodbridge
description: "FoodBridge - Surplus Food Donation Coordination, Food-Waste Awareness & Impact Reporting"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  
  # Routing & Navigation
  go_router: ^14.2.0
  
  # UI, Icons & Charts
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  
  # Exporting & Reporting
  csv: ^6.0.0
  pdf: ^3.10.8
  printing: ^5.12.0
  
  # Backend Services (Firebase)
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
